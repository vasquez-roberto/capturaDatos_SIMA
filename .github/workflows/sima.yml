- name: 1. Descargar datos en vivo SIMA
  run: python descargar_sima_definitivo.py

- name: 2. Generar GeoJSON para ArcGIS
  run: python generar_geojson.py

- name: 3. Actualizar Histórico Acumulado
  run: python actualizar_historico.py

- name: 4. Push cambios a GitHub
  run: |
    git config --global user.name "github-actions[bot]"
    git config --global user.email "github-actions[bot]@users.noreply.github.com"
    git add sima_lecturas_estaciones.csv sima_estaciones.geojson sima_historico.csv
    git commit -m "Actualizacion automatica SIMA - $(date)" || exit 0
    git push