name: SIMA Data Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-sima:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 3. Instalar librerias necesarias
        run: pip install requests pandas

      - name: 4. Descargar datos en vivo SIMA
        run: python descargar_sima_definitivo.py

      - name: 5. Generar GeoJSON para ArcGIS
        run: python generar_geojson.py

      - name: 6. Actualizar Historico Acumulado
        run: python actualizar_historico.py

      - name: 7. Push cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sima_lecturas_estaciones.csv sima_estaciones.geojson sima_historico.csv
          git commit -m "Actualizacion automatica SIMA - $(date)" || exit 0
          git push
